# -----------------
# LSPatch 与模块设置
# -----------------

# [LSPatch]
LSPatch:
  repo: "LSPosed/LSPatch"

# [模块]
modules:
  # --- 预设模块 ---
  # 将值设为 true 来启用模块，设为 false 则禁用
  QAuxiliary: true
  XAutoDaily: false
  TSBattery: false
  QQCleaner: false

  # --- 自定义模块 ---
  custom:
    enable: false
    list:
    - name: "QStory"
      download_link: "https://qstory.sacz.top/update/download"

# -----------------
# QQ 版本设置
# -----------------
QQ:
  custom:
    enable: true
    version: "9.0.75"
    url: "https://qq.com"

  latest:
    enable: false

# -----------------
# 修补设置
# -----------------
force:
  enable: false
